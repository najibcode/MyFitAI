<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Deep Obsidian Athletic Background -->
  <rect width="512" height="512" rx="128" fill="#080808" />
  <rect x="2" y="2" width="508" height="508" rx="126" fill="none" stroke="#2A2A2D" stroke-width="4" opacity="0.6"/>
  
  <defs>
    <!-- Athletic Electric Green Gradient -->
    <linearGradient id="myfitai-primary-grad" x1="100" y1="420" x2="420" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="50%" stop-color="#30D158" />
      <stop offset="100%" stop-color="#5EEB78" />
    </linearGradient>

    <!-- Frosted Silver-White Precision Gradient -->
    <linearGradient id="myfitai-silver-grad" x1="160" y1="110" x2="420" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A1A1A6" />
    </linearGradient>

    <!-- Biometric Core Glow Filter -->
    <filter id="myfitai-core-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#30D158" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Primary Surge Blade (Ascending Power Vector) -->
  <path
    d="M102 398 L215 114 C221 98 239 98 245 114 L316 246 L245 286 L194 195 L123 398 Z"
    fill="url(#myfitai-primary-grad)"
    filter="url(#myfitai-core-glow)"
  />

  <!-- Interlocking Apex Crest Blade (Precision Counter Vector) -->
  <path
    d="M245 114 C251 98 269 98 275 114 L408 398 L337 398 L296 307 L347 195 L275 246 Z"
    fill="url(#myfitai-silver-grad)"
  />

  <!-- Center Biometric Core Spark -->
  <polygon
    points="260,184 290,245 260,306 230,245"
    fill="#30D158"
  />
</svg>